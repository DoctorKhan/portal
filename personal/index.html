<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Rez Khan | Personal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <!-- Lucide Icons for a professional touch -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #020617;
            --surface-bg: rgba(15, 23, 42, 0.55);
            --card-bg: rgba(30, 41, 59, 0.66);
            --card-bg-hover: rgba(51, 65, 85, 0.76);
            --border-color: rgba(71, 85, 105, 0.55);
            --accent-color: #38bdf8;
            --yt-color: #ef4444; 
            --ig-color: #e879f9; 
            --x-color: #ffffff;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --panel-shadow: 0 24px 45px -34px rgba(0, 0, 0, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(56, 189, 248, 0.18) 0%, transparent 52%),
                radial-gradient(circle at 0% 100%, rgba(56, 189, 248, 0.06) 0%, transparent 50%),
                linear-gradient(180deg, #020617 0%, #030712 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: clamp(28px, 7vh, 62px) 18px 40px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            animation: fadeIn 0.8s ease-out;
        }

        .profile-pic-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 4px;
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            object-fit: cover;
            display: block;
        }

        /* Fallback initials if image is missing */
        .profile-pic-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
            z-index: -1;
            background: #1e293b;
        }

        h1 {
            font-family: "Space Grotesk", "IBM Plex Sans", sans-serif;
            font-size: clamp(1.55rem, 2.5vw, 1.85rem);
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.025em;
            line-height: 1.15;
        }

        .tagline {
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-size: 0.92rem;
            text-align: center;
            line-height: 1.5;
            max-width: 320px;
            text-wrap: balance;
        }

        .section-label {
            width: 100%;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin: 20px 0 10px 12px;
            opacity: 0.95;
        }

        .route-nav {
            width: 100%;
            max-width: 460px;
            display: flex;
            gap: 10px;
            padding: 6px 6px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.22);
            border: 1px solid rgba(71, 85, 105, 0.4);
            margin: 2px 0 6px;
        }

        .route-link {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 10px 8px;
            border-radius: 999px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .route-link:hover {
            color: var(--text-primary);
            border-color: rgba(56, 189, 248, 0.35);
            background: rgba(56, 189, 248, 0.08);
        }

        .route-link.active {
            color: #021018;
            border-color: rgba(56, 189, 248, 0.9);
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.95), rgba(56, 189, 248, 0.6));
            box-shadow: 0 12px 26px -18px rgba(56, 189, 248, 0.95);
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.34));
            border: 1px solid rgba(51, 65, 85, 0.45);
            box-shadow: var(--panel-shadow);
        }

        .link-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            min-height: 58px;
            padding: 15px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color);
        }

        .link-card:hover {
            transform: translateY(-2px) scale(1.004);
            background-color: var(--card-bg-hover);
            border-color: var(--accent-color);
            box-shadow: 0 14px 24px -18px rgba(56, 189, 248, 0.65);
        }

        .link-card:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
            border-color: var(--accent-color);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
            line-height: 1.35;
        }

        .icon {
            width: 19px;
            height: 19px;
            color: var(--accent-color);
            flex-shrink: 0;
        }

        .icon-yt { color: var(--yt-color); }
        .icon-ig { color: var(--ig-color); }
        .icon-x { color: var(--x-color); }

        .chevron {
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
            opacity: 0.5;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .link-card:hover .chevron {
            transform: translateX(2px);
            opacity: 0.85;
        }

        .qr-section {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 22px 20px 18px;
            background:
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.2), transparent 60%),
                linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(30, 41, 59, 0.9));
            border-radius: 22px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow:
                0 20px 40px -30px rgba(56, 189, 248, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .qr-section::before {
            content: "Scan Me";
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #0f172a;
            background: var(--accent-color);
            border-radius: 999px;
            padding: 6px 9px;
        }

        .qr-code {
            width: 164px;
            height: 164px;
            padding: 10px;
            background: #ffffff;
            border: 1px solid rgba(203, 213, 225, 0.8);
            border-radius: 18px;
            box-shadow:
                0 14px 24px -16px rgba(0, 0, 0, 0.9),
                0 0 0 4px rgba(255, 255, 255, 0.06);
        }

        .qr-text {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 600;
        }

        .footer {
            margin-top: auto;
            padding-top: 26px;
            color: var(--text-secondary);
            font-size: 0.68rem;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            opacity: 0.85;
        }

        @media (max-width: 520px) {
            .container {
                gap: 14px;
            }

            .links-container {
                padding: 10px;
                border-radius: 20px;
            }

            .section-label {
                margin: 16px 0 8px 10px;
            }

            .link-card {
                padding: 14px 15px;
                border-radius: 14px;
            }

            .qr-section {
                margin-top: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Section -->
        <div class="profile-pic-container">
            <!-- Fetching image directly from GitHub -->
            <img src="https://github.com/DoctorKhan.png" alt="Dr. Rez Khan" class="profile-pic" onerror="this.style.display='none'">
            <div class="profile-pic-fallback">RK</div>
        </div>
        
        <h1>Dr. Rez Khan</h1>
        <p class="tagline">Neurotech &bull; Cybersecurity &bull; Elata</p>

        <nav class="route-nav" aria-label="Site sections">
            <a href="../" class="route-link" data-route="spiritual" data-file-href="../index.html">Practice</a>
            <a href="../professional/" class="route-link" data-route="professional" data-file-href="../professional/index.html">Professional</a>
            <a href="./" class="route-link" data-route="personal" data-file-href="./index.html">Personal</a>
        </nav>

        <div class="links-container">
            <div class="section-label">Connect</div>
            <a href="https://instagram.com/dr.rez.khan" class="link-card">
                <div class="link-content">
                    <i data-lucide="instagram" class="icon icon-ig"></i>
                    <span>Get in Touch (Instagram DM)</span>
                </div>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>
        </div>

        <!-- QR Code Sharing Section -->
        <div class="qr-section">
            <img id="qr-image" class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://dr.rezkhan.net/&color=38bdf8&bgcolor=020617" alt="QR Code for Dr. Rez Khan portal">
            <p class="qr-text">Scan to share portal</p>
        </div>

        <div class="footer">
            &copy; 2024 Dr. Rez Khan
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // When opened via file://, directory URLs (e.g. .../professional/) may not auto-load index.html.
        // Rewrite route links to explicit index.html for local file usage.
        if (window.location.protocol === 'file:') {
            document.querySelectorAll('.route-link[data-file-href]').forEach((el) => {
                el.href = el.dataset.fileHref;
            });
        }

        // Highlight active route tab
        const path = window.location.pathname;
        const active =
            path.includes('/professional') ? 'professional' :
            path.includes('/personal') ? 'personal' :
            'spiritual';

        document.querySelectorAll('.route-link').forEach((el) => {
            el.classList.toggle('active', el.dataset.route === active);
        });

        // Create QR code for the current URL
        const shareUrl = window.location.href;
        const qrImg = document.getElementById('qr-image');
        if (qrImg) {
            qrImg.src =
                'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' +
                encodeURIComponent(shareUrl) +
                '&color=38bdf8&bgcolor=020617';
        }
    </script>
</body>
</html>
