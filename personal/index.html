    <script>
        const PERSONAL_SESSION_KEY = 'drrezpersonal:session';
        const PERSONAL_SESSION_TTL_MS = 24 * 60 * 60 * 1000;
        const SHA256_HEX = '7692c3ad3540bb803c020b3aee66cd8887123234ea0c6e7143c0add73ff431ed';

        async function sha256Hex(str) {
            const buf = await crypto.subtle.digest('SHA-256', (new TextEncoder()).encode(str));
            return Array.from(new Uint8Array(buf)).reduce((s, b) => s + ('0' + b.toString(16)).slice(-2), '');
        }

        async function decryptPersonal(blob, password) {
            const salt = Uint8Array.from(atob(blob.salt), c => c.charCodeAt(0));
            const iv = Uint8Array.from(atob(blob.iv), c => c.charCodeAt(0));
            const ct = Uint8Array.from(atob(blob.ct), c => c.charCodeAt(0));
            const key = await crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', new Uint8Array(salt)), 'AES-GCM', false, ['decrypt']);
            const aesKey = await crypto.subtle.importKey('raw', key, { name: 'AES-GCM' }, false, ['decrypt']);
            const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, ct);
            return new TextDecoder().decode(dec);
        }

        function personalSessionValid() {
            const raw = localStorage.getItem(PERSONAL_SESSION_KEY);
            if (!raw) return false;
            try { const obj = JSON.parse(raw); return obj.expiresAt > Date.now(); } catch { return false; }
        }

        function setPersonalSession() {
            localStorage.setItem(PERSONAL_SESSION_KEY, JSON.stringify({ expiresAt: Date.now() + PERSONAL_SESSION_TTL_MS }));
        }

        async function unlockPersonal() {
            const input = document.getElementById('personal-password-input');
            const err = document.getElementById('personal-password-error');
            const submit = document.getElementById('personal-password-submit');
            submit.disabled = true;
            submit.textContent = 'Unlocking...';
            try {
                const pw = input.value || '';
                if ((await sha256Hex(pw)) !== SHA256_HEX) {
                    throw new Error('Incorrect password');
                }
                setPersonalSession();
                window.location.reload();
            } catch (e) {
                err.textContent = e.message;
                submit.disabled = false;
                submit.textContent = 'Unlock';
                input.focus();
            }
        }

        document.getElementById('personal-password-submit').addEventListener('click', unlockPersonal);

        (async function init() {
            const container = document.getElementById('personal-content');
            if (!window.__PERSONAL_BLOB) {
                document.getElementById('personal-password-error').textContent = 'Personal content is unavailable.';
                return;
            }
            if (personalSessionValid()) {
                try {
                    const html = await decryptPersonal(window.__PERSONAL_BLOB, '');
                    document.getElementById('personal-password-gate').classList.add('hidden');
                    container.insertAdjacentHTML('beforeend', html.trim());
                    if (window.lucide) lucide.createIcons();
                } catch (e) {
                    document.getElementById('personal-password-error').textContent = 'Decryption failed.';
                }
            }
        })();
    </script>
