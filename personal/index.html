<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Rez Khan | Personal</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../common.css" />
  <style>
    :root { --accent-color: #38bdf8; --accent-rgb: 56,189,248; }
    body { font-family: 'IBM Plex Sans', sans-serif; background: #020617; color: #e2e8f0; }
    .container { max-width: 980px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; text-align: center; }
    .tagline { text-align: center; color: #94a3b8; margin-top: 6px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 14px; margin-top: 28px; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px; color: inherit; text-decoration: none; }
    .password-gate {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; min-height: 320px; text-align: center; padding: 22px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dr. Rez Khan</h1>
    <p class="tagline">Personal</p>
    <div class="password-gate" id="personal-password-gate">
      <label for="personal-password-input">Enter password to view personal links</label>
      <input type="password" id="personal-password-input" placeholder="Password" autocomplete="current-password" />
      <div class="password-error" id="personal-password-error"></div>
      <button id="personal-password-submit">Unlock</button>
    </div>
    <div class="links-container hidden" id="personal-content"></div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script id="personal-blob" type="application/json">{"salt":"P0OTQOivlBY82zuaMqP/cg==","iv":"bJdCFnAL6wOCPlRS","ct":"VRUJ82MgWxBba6YRriEhKXsFSPfLYJcjeK4+tnxcJerBMP6AeuxYw+660nH9VwlL/Z6n8Yk+s7wvkcAX+1WkWFDP9jc70PI/P4cgBItwRrmR5rgD+WxODRziF+r668Dqi2Bw2607rIN0YWjUMKlJYTU1CJn/dqW3Pspv"}</script>
  <script>
    const PERSONAL_SESSION_KEY = 'drrezpersonal:session';
    const PERSONAL_SESSION_TTL_MS = 24 * 60 * 60 * 1000;
    const PERSONAL_CACHE_KEY = 'drrezpersonal:cache';
    const PERSONAL_BLOB_KEY = 'drrezpersonal:blob';
    const HAS_PERSONAL_BLOB = !!document.getElementById('personal-blob');

    function getBlob() {
      const stored = localStorage.getItem(PERSONAL_BLOB_KEY);
      if (stored) {
        try { return JSON.parse(stored); } catch {}
      }
      const el = document.getElementById('personal-blob');
      if (el && el.textContent) {
        try { localStorage.setItem(PERSONAL_BLOB_KEY, el.textContent); } catch {}
        try { return JSON.parse(el.textContent); } catch {}
      }
      return null;
    }

    async function decryptPersonal(blob, password) {
      const salt = Uint8Array.from(atob(blob.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(blob.iv), c => c.charCodeAt(0));
      const ct = Uint8Array.from(atob(blob.ct), c => c.charCodeAt(0));
      const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const aesKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, ct);
      return new TextDecoder().decode(dec);
    }

    function personalSessionValid() {
      const raw = localStorage.getItem(PERSONAL_SESSION_KEY);
      if (!raw) return false;
      try { const obj = JSON.parse(raw); return obj.expiresAt > Date.now(); } catch { return false; }
    }

    function setPersonalSession() {
      localStorage.setItem(PERSONAL_SESSION_KEY, JSON.stringify({ expiresAt: Date.now() + PERSONAL_SESSION_TTL_MS }));
    }

    function showPersonalContent(html) {
      const gate = document.getElementById('personal-password-gate');
      const container = document.getElementById('personal-content');
      if (gate) gate.classList.add('hidden');
      container.insertAdjacentHTML('beforeend', html.trim());
      if (window.lucide) lucide.createIcons();
    }

    async function unlockPersonal() {
      const input = document.getElementById('personal-password-input');
      const err = document.getElementById('personal-password-error');
      const submit = document.getElementById('personal-password-submit');
      submit.disabled = true;
      submit.textContent = 'Unlocking...';
      try {
        const pw = input.value || '';
        const html = await decryptPersonal(getBlob(), pw);
        sessionStorage.setItem(PERSONAL_CACHE_KEY, html);
        setPersonalSession();
        showPersonalContent(html);
      } catch (e) {
        err.textContent = 'Incorrect password';
        submit.disabled = false;
        submit.textContent = 'Unlock';
        input.focus();
      }
    }

    document.getElementById('personal-password-submit').addEventListener('click', unlockPersonal);
    document.getElementById('personal-password-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlockPersonal();
    });

    (function syncPersonalBlob() {
      const el = document.getElementById('personal-blob');
      if (!el || !el.textContent) return;
      try {
        localStorage.setItem(PERSONAL_BLOB_KEY, el.textContent);
      } catch {
        // storage unavailable
      }
    })();

    (async function init() {
      const container = document.getElementById('personal-content');
      if (!HAS_PERSONAL_BLOB) {
        document.getElementById('personal-password-error').textContent = 'Personal content is unavailable.';
        return;
      }
      if (!personalSessionValid()) {
        return;
      }
      const cached = sessionStorage.getItem(PERSONAL_CACHE_KEY);
      if (cached) {
        showPersonalContent(cached);
      }
    })();
  </script>
</body>
</html>
