<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Rez Khan | Personal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="../common.css">
    <style>
        :root {
            --accent-color: #38bdf8;
            --accent-rgb: 56, 189, 248;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profile Section -->
        <div class="profile-pic-container">
            <img src="https://github.com/DoctorKhan.png" alt="Dr. Rez Khan" class="profile-pic" onerror="this.style.display='none'">
            <div class="profile-pic-fallback">RK</div>
        </div>

        <h1>Dr. Rez Khan</h1>
        <p class="tagline">Neurotech &bull; Cybersecurity &bull; Elata</p>

        <nav class="route-nav" aria-label="Site sections">
            <a href="../" class="route-link" data-route="spiritual" data-file-href="../index.html">Practice</a>
            <a href="../professional/" class="route-link" data-route="professional" data-file-href="../professional/index.html">Professional</a>
            <a href="./" class="route-link" data-route="personal" data-file-href="./index.html">Personal</a>
        </nav>

        <div class="links-container">
            <div class="section-label">Connect</div>
            <a href="https://instagram.com/dr.rez.khan" class="link-card hero-card">
                <div class="link-content">
                    <i data-lucide="instagram" class="icon icon-ig"></i>
                    <span>Get in Touch (Instagram DM)</span>
                </div>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>
        </div>

        <!-- QR Code Sharing Section -->
        <div class="qr-section">
            <img
                id="qr-image"
                class="qr-code"
                src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://dr.rezkhan.net/&color=38bdf8&bgcolor=020617"
                alt="QR Code for Dr. Rez Khan portal"
            >
            <p class="qr-text">Scan to share portal</p>
        </div>

        <div class="footer">
            &copy; 2024 Dr. Rez Khan
        </div>
    </div>

    <script src="../common.js"></script>
</body>
</html>
