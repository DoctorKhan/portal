<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Rez Khan | Share</title>
    <meta name="description" content="Share Dr. Rez Khan's portal — AI security consulting and Serenus One.">
    <meta name="theme-color" content="#020617">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../common.css">
    <style>
        :root {
            --accent-color: #38bdf8;
            --accent-rgb: 56, 189, 248;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="profile-pic-container">
                <img
                    src="../assets/Rez%20Professional.jpeg"
                    alt="Dr. Rez Khan"
                    class="profile-pic"
                    width="132"
                    height="132"
                    decoding="async"
                    fetchpriority="high"
                    onerror="this.style.display='none'"
                >
                <div class="profile-pic-fallback" aria-hidden="true">RK</div>
            </div>
            <div class="site-identity">
                <h1>Dr. Rez Khan</h1>
                <p class="tagline">AI Security &bull; Secure AI Systems &bull; Serenus One</p>
            </div>
        </header>

        <nav class="route-nav" aria-label="Site sections">
            <a href="../" class="route-link" data-route="professional" data-file-href="../index.html">Professional</a>
            <a href="./" class="route-link active" data-route="share" data-file-href="./index.html">Share</a>
        </nav>

        <div class="links-container">
            <div class="share-view">
                <div class="qr-card">
                    <img
                        class="qr-image"
                        id="qr-image"
                        src=""
                        alt="QR code for dr.rezkhan.net"
                        width="220"
                        height="220"
                    >
                    <p class="qr-label">Scan to share portal</p>
                </div>
            </div>
        </div>

        <div class="footer">&copy; 2026 Dr. Rez Khan</div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../common.js"></script>
</body>
</html>
